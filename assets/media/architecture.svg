<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<defs>
<style>
.title{font-family:"Space Grotesk","Inter","Segoe UI",sans-serif;font-size:54px;font-weight:800;letter-spacing:1.1px;fill:#E8EDF5}
.input-label{font-family:"Bebas Neue","Impact","Arial Narrow",sans-serif;font-size:44px;font-weight:700;letter-spacing:2.2px;fill:#F4F7FF}
.compress-label{font-family:"Archivo Black","Arial Black","Segoe UI",sans-serif;font-size:30px;font-weight:900;letter-spacing:.9px;fill:#F4F7FF}
.router-label{font-family:"Orbitron","Rajdhani","Segoe UI",sans-serif;font-size:31px;font-weight:900;letter-spacing:1.6px;fill:#F4F7FF}
.micro-label{font-family:"Unbounded","Arial Black","Segoe UI",sans-serif;font-size:28px;font-weight:800;letter-spacing:.55px;fill:#F4F7FF}
.nano-label{font-family:"Audiowide","Orbitron","Segoe UI",sans-serif;font-size:20px;font-weight:700;letter-spacing:1px;fill:#D7C8FF}
.small{font-family:"IBM Plex Sans","Inter","Segoe UI",sans-serif;font-size:24px;font-weight:400;fill:#B7C2D4}
.mono{font-family:"JetBrains Mono","Fira Code","IBM Plex Mono",monospace;font-size:22px;font-weight:600;fill:#9FEFFF}
.active-text{font-family:"JetBrains Mono","Fira Code",monospace;font-size:21px;font-weight:800;letter-spacing:1.1px;fill:#071018}
.box{fill:#FFFFFF;fill-opacity:.08;stroke:#FFFFFF;stroke-opacity:.25;stroke-width:3.3}
.active{stroke:#36E0FF;filter:url(#glow)}
.router{stroke:#8B7CFF}
.line{stroke:#8DA2C4;stroke-width:4.6;fill:none}
.flow{stroke:#36E0FF;stroke-width:4.6;stroke-dasharray:19 19;animation:flow 2s linear infinite}
.pulse{animation:pulse 2s infinite}
@keyframes flow{from{stroke-dashoffset:38}to{stroke-dashoffset:0}}
@keyframes pulse{0%{opacity:.45}50%{opacity:1}100%{opacity:.45}}
</style>

<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="8" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#151A24"/>
<stop offset="1" stop-color="#303744"/>
</linearGradient>

<linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#36E0FF"/>
<stop offset="1" stop-color="#6AF4FF"/>
</linearGradient>

<linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#8B7CFF"/>
<stop offset="1" stop-color="#B89CFF"/>
</linearGradient>
</defs>

<rect width="1400" height="1000" fill="url(#bg)"/>

<text x="700" y="62" text-anchor="middle" class="title">
Deep Fractal Sparse Heterogeneous Ensemble
</text>

<text x="700" y="103" text-anchor="middle" class="small">
Hierarchical sparse routing through specialized neural modules
</text>

<rect x="490" y="132" width="420" height="108" rx="27" class="box"/>

<text x="700" y="183" text-anchor="middle" class="input-label">
INPUT
</text>

<text x="700" y="219" text-anchor="middle" class="small">
text • image • binary data
</text>

<path d="M700 240 L700 274" class="line flow"/>

<rect x="440" y="274" width="520" height="128" rx="27" class="box"/>

<text x="700" y="325" text-anchor="middle" class="compress-label">
COMPRESSION LAYER
</text>

<text x="700" y="365" text-anchor="middle" class="small">
64 dimensions → 6 compact representation
</text>

<path d="M700 402 L700 434" class="line flow"/>

<rect x="385" y="434" width="630" height="155" rx="31" class="box router active pulse"/>

<text x="700" y="492" text-anchor="middle" class="router-label">
MACRO ROUTER
</text>

<text x="700" y="532" text-anchor="middle" class="mono">
1000 macro-expert slots → selects k=50
</text>

<text x="700" y="566" text-anchor="middle" class="small">
sparse expert routing layer
</text>

<path d="M700 589 L700 620" class="line flow"/>

<text x="700" y="648" text-anchor="middle" class="small">
Distributed heterogeneous expert population
</text>

<g opacity=".35">
<circle cx="200" cy="712" r="41" fill="#77808F"/>
<circle cx="330" cy="712" r="41" fill="#77808F"/>
<circle cx="460" cy="712" r="41" fill="#77808F"/>
<circle cx="940" cy="712" r="41" fill="#77808F"/>
<circle cx="1070" cy="712" r="41" fill="#77808F"/>
<circle cx="1200" cy="712" r="41" fill="#77808F"/>
</g>

<circle cx="700" cy="712" r="60" fill="url(#cyan)" filter="url(#glow)" class="pulse"/>

<text x="700" y="719" text-anchor="middle" class="active-text">
ACTIVE
</text>

<text x="700" y="792" text-anchor="middle" class="small">
Selected expert receives routed computation
</text>

<path d="M700 812 L700 846" class="line flow"/>

<rect x="385" y="846" width="630" height="128" rx="31" class="box active"/>

<text x="700" y="892" text-anchor="middle" class="micro-label">
MICRO EXPERT
</text>

<text x="700" y="926" text-anchor="middle" class="small">
Local router selects and weights specialized nano modules
</text>

<text x="700" y="958" text-anchor="middle" class="mono">
5 nano operators → top-2 routed
</text>

<text x="700" y="990" text-anchor="middle" class="nano-label">
MLP • CNN • LINEAR ATTENTION • SOFTTREE • RECURRENT OPERATOR
</text>
</svg>
