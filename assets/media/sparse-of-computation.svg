<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.title{font-family:"Rajdhani","Arial Narrow",sans-serif;font-size:64px;font-weight:700;letter-spacing:5.5px;fill:#F1F3F5}
.subtitle{font-family:"IBM Plex Sans","Segoe UI",sans-serif;font-size:27px;letter-spacing:1.6px;fill:#AEB7BE}
.final-label{font-family:"IBM Plex Sans","Segoe UI",sans-serif;font-size:32px;letter-spacing:1.8px;fill:#AEB7BE}
.section{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:34px;font-weight:800;letter-spacing:3.2px;fill:#F3F4F5}
.metric{font-family:"Space Mono","IBM Plex Mono",monospace;font-size:46px;font-weight:700;fill:#FFB347}
.metric-large{font-family:"Space Mono","IBM Plex Mono",monospace;font-size:60px;font-weight:700;fill:#FFB347}
.metric-small{font-family:"Space Mono","IBM Plex Mono",monospace;font-size:20px;font-weight:600;fill:#C5CDD3}
.metric-small-large{font-family:"Space Mono","IBM Plex Mono",monospace;font-size:26px;font-weight:700;fill:#C5CDD3}
.k-label{font-family:"Space Mono","IBM Plex Mono",monospace;font-size:30px;font-weight:700;fill:#FFB347;letter-spacing:1px}
.node-label{font-family:"IBM Plex Mono","Courier New",monospace;font-size:21px;font-weight:600;fill:#BFC7CC}
.active-label{font-family:"Space Mono","IBM Plex Mono",monospace;font-size:22px;font-weight:700;letter-spacing:1.6px;fill:#101417}
.nano-label{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:25px;font-weight:800;letter-spacing:1.6px;fill:#E8FFF0}
.line{fill:none;stroke:#59636A;stroke-width:3.4}
.flow{fill:none;stroke:#FFB347;stroke-width:5;stroke-dasharray:16 14;animation:flow 1.6s linear infinite}
.green-flow{fill:none;stroke:#71E6A1;stroke-width:5;stroke-dasharray:15 13;animation:flow 1.3s linear infinite}
.node{fill:#59636A}
.node-active{fill:#FFB347;filter:url(#amberGlow)}
.nano{fill:#465149;stroke:#66736A;stroke-width:2.6}
.nano-active{fill:#71E6A1;stroke:#B7FFD0;stroke-width:3.4;filter:url(#greenGlow)}
.idle{animation:idle 3s ease-in-out infinite}
.active{animation:active 2s ease-in-out infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes flow{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes idle{0%,100%{opacity:.28}50%{opacity:.5}}
@keyframes active{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style>

<filter id="amberGlow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="7.5" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<filter id="greenGlow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="7.5" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111517"/>
<stop offset=".5" stop-color="#202629"/>
<stop offset="1" stop-color="#111719"/>
</linearGradient>

<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#293135" stop-opacity=".9"/>
<stop offset="1" stop-color="#171D20" stop-opacity=".9"/>
</linearGradient>
</defs>

<rect width="1400" height="900" fill="url(#bg)"/>

<rect x="10" y="6" width="1380" height="888" rx="36" fill="url(#panel)" stroke="#3D464B" stroke-width="2.6"/>

<text x="700" y="56" text-anchor="middle" class="title">
SPARSE ROUTING FIELD
</text>

<text x="700" y="92" text-anchor="middle" class="subtitle">
A single forward pass routes a sparse subset
</text>

<text x="56" y="136" class="section">
MACRO ROUTING
</text>

<text x="56" y="192" text-anchor="start" class="metric-large">
1000
</text>

<text x="240" y="188" text-anchor="start" class="metric-small-large">
MACRO-EXPERT SLOTS
</text>

<text x="56" y="222" class="subtitle">
candidate expert population
</text>

